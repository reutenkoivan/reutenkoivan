<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="320" height="202" viewBox="0 0 320 202">
  <title id="title">Engineering approach — the codebase is the proof</title>
  <desc id="desc">Architectural decisions become implementation constraints. Developer experience becomes reliable tooling and feedback loops. The result is software teams can extend, validate, and evolve with confidence.</desc>
  <style>
    .card { fill: #ffffff; stroke: #d0d7de; }
    .panel { fill: #f6f8fa; }
    .line { stroke: #d0d7de; }
    .kicker { fill: #656d76; font: 700 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1px; }
    .headline { fill: #1f2328; font: 650 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .copy { fill: #656d76; font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #30363d; }
      .panel { fill: #161b22; }
      .line { stroke: #30363d; }
      .kicker, .copy { fill: #8d96a0; }
      .headline { fill: #e6edf3; }
    }
  </style>
  <rect class="card" x="0.5" y="0.5" width="319" height="201" rx="7"/>
  <path class="panel" d="M1 7a6 6 0 0 1 6-6h306a6 6 0 0 1 6 6v72H1z"/>
  <path class="line" d="M1 79h318"/>
  <text class="kicker" x="16" y="25">ENGINEERING APPROACH</text>
  <text class="headline" x="16" y="54">The codebase is the proof.</text>

  <text class="copy" x="16" y="106">Architectural decisions become implementation</text>
  <text class="copy" x="16" y="124">constraints. Developer experience becomes reliable</text>
  <text class="copy" x="16" y="142">tooling and feedback loops. The result is software</text>
  <text class="copy" x="16" y="160">teams can extend, validate, and evolve with</text>
  <text class="copy" x="16" y="178">confidence.</text>
</svg>
