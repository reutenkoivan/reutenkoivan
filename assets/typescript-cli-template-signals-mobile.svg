<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="320" height="252" viewBox="0 0 320 252">
  <title id="title">typescript-cli-template engineering flow</title>
  <desc id="desc">Turborepo leads to strict TypeScript, dependency checks, and tests with documentation.</desc>
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .accent { fill: #0969da; }
    .label { fill: #1f2328; font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .arrow { fill: #656d76; font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #30363d; }
      .accent { fill: #58a6ff; }
      .label { fill: #e6edf3; }
      .arrow { fill: #8d96a0; }
    }
  </style>
  <g>
    <rect class="box" x="1" y="1" width="318" height="48" rx="6"/>
    <rect class="accent" x="1" y="1" width="4" height="48" rx="2"/>
    <text class="label" x="160" y="30" text-anchor="middle">Turborepo</text>
    <text class="arrow" x="160" y="68" text-anchor="middle">↓</text>

    <rect class="box" x="1" y="69" width="318" height="48" rx="6"/>
    <rect class="accent" x="1" y="69" width="4" height="48" rx="2"/>
    <text class="label" x="160" y="98" text-anchor="middle">Strict TypeScript</text>
    <text class="arrow" x="160" y="136" text-anchor="middle">↓</text>

    <rect class="box" x="1" y="137" width="318" height="48" rx="6"/>
    <rect class="accent" x="1" y="137" width="4" height="48" rx="2"/>
    <text class="label" x="160" y="166" text-anchor="middle">Dependency checks</text>
    <text class="arrow" x="160" y="204" text-anchor="middle">↓</text>

    <rect class="box" x="1" y="205" width="318" height="46" rx="6"/>
    <rect class="accent" x="1" y="205" width="4" height="46" rx="2"/>
    <text class="label" x="160" y="233" text-anchor="middle">Tests + docs</text>
  </g>
</svg>
