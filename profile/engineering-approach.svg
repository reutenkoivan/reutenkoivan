<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="840" height="126" viewBox="0 0 840 126">
  <title id="title">Engineering approach — the codebase is the proof</title>
  <desc id="desc">Architectural decisions become implementation constraints. Developer experience becomes reliable tooling and feedback loops. The result is software teams can extend, validate, and evolve with confidence.</desc>
  <style>
    .card { fill: #ffffff; stroke: #d0d7de; }
    .panel { fill: #f6f8fa; }
    .line { stroke: #d0d7de; }
    .kicker { fill: #656d76; font: 700 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1px; }
    .headline { fill: #1f2328; font: 650 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .copy { fill: #656d76; font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #30363d; }
      .panel { fill: #161b22; }
      .line { stroke: #30363d; }
      .kicker, .copy { fill: #8d96a0; }
      .headline { fill: #e6edf3; }
    }
  </style>
  <rect class="card" x="0.5" y="0.5" width="839" height="125" rx="7"/>
  <path class="panel" d="M1 7a6 6 0 0 1 6-6h213v124H7a6 6 0 0 1-6-6z"/>
  <path class="line" d="M220 1v124"/>
  <text class="kicker" x="22" y="29">ENGINEERING APPROACH</text>
  <text class="headline" x="22" y="58">The codebase is</text>
  <text class="headline" x="22" y="84">the proof.</text>

  <text class="copy" x="246" y="34">Architectural decisions become implementation constraints.</text>
  <text class="copy" x="246" y="56">Developer experience becomes reliable tooling and feedback loops.</text>
  <text class="copy" x="246" y="78">The result is software teams can extend, validate, and evolve</text>
  <text class="copy" x="246" y="100">with confidence.</text>
</svg>
