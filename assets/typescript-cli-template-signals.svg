<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="840" height="96" viewBox="0 0 840 96">
  <title id="title">typescript-cli-template engineering flow</title>
  <desc id="desc">Turborepo leads to strict TypeScript, dependency checks, and tests with documentation.</desc>
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; }
    .accent { fill: #0969da; }
    .label { fill: #1f2328; font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .arrow { fill: #656d76; font: 600 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #30363d; }
      .accent { fill: #58a6ff; }
      .label { fill: #e6edf3; }
      .arrow { fill: #8d96a0; }
    }
  </style>
  <g>
    <rect class="box" x="1" y="18" width="178" height="60" rx="6"/>
    <rect class="accent" x="1" y="18" width="4" height="60" rx="2"/>
    <text class="label" x="90" y="53" text-anchor="middle">Turborepo</text>

    <text class="arrow" x="196" y="54">→</text>

    <rect class="box" x="221" y="18" width="178" height="60" rx="6"/>
    <rect class="accent" x="221" y="18" width="4" height="60" rx="2"/>
    <text class="label" x="310" y="53" text-anchor="middle">Strict TypeScript</text>

    <text class="arrow" x="416" y="54">→</text>

    <rect class="box" x="441" y="18" width="178" height="60" rx="6"/>
    <rect class="accent" x="441" y="18" width="4" height="60" rx="2"/>
    <text class="label" x="530" y="53" text-anchor="middle">Dependency checks</text>

    <text class="arrow" x="636" y="54">→</text>

    <rect class="box" x="661" y="18" width="178" height="60" rx="6"/>
    <rect class="accent" x="661" y="18" width="4" height="60" rx="2"/>
    <text class="label" x="750" y="53" text-anchor="middle">Tests + docs</text>
  </g>
</svg>
