name: Update profile stats

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-profile-stats.yml
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate public activity card
        id: stats_attempt_1
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide_title=true&hide_border=true&bg_color=00000000"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: 2.1.3
          fail_on_error: true

      - name: Wait before second attempt
        if: steps.stats_attempt_1.outcome == 'failure'
        shell: bash
        run: sleep 10

      - name: Retry public activity card
        id: stats_attempt_2
        if: steps.stats_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide_title=true&hide_border=true&bg_color=00000000"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: 2.1.3
          fail_on_error: true

      - name: Wait before final attempt
        if: steps.stats_attempt_1.outcome == 'failure' && steps.stats_attempt_2.outcome == 'failure'
        shell: bash
        run: sleep 20

      - name: Generate public activity card — final attempt
        if: steps.stats_attempt_1.outcome == 'failure' && steps.stats_attempt_2.outcome == 'failure'
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide_title=true&hide_border=true&bg_color=00000000"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: 2.1.3
          fail_on_error: true

      - name: Commit updated card
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh profile stats"
          git push
