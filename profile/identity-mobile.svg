<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="320" height="266" viewBox="0 0 320 266">
  <title id="title">Ivan Reutenko — Frontend Architect</title>
  <desc id="desc">Most recently Frontend Architect; previously Tech Lead and Team Lead. Focused on architecture, developer experience, and scalability.</desc>
  <style>
    .card { fill: #ffffff; stroke: #d0d7de; }
    .cell { fill: #f6f8fa; stroke: #d0d7de; }
    .green { fill: #dafbe1; stroke: #9be9a8; }
    .kicker { fill: #656d76; font: 700 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1px; }
    .role { fill: #1f2328; font: 650 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .history { fill: #656d76; font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .history-strong { fill: #1f2328; font-weight: 600; }
    .label { fill: #1f2328; font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .detail { fill: #656d76; font: 400 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #30363d; }
      .cell { fill: #161b22; stroke: #30363d; }
      .green { fill: #0e4429; stroke: #006d32; }
      .kicker, .history, .detail { fill: #8d96a0; }
      .role, .history-strong, .label { fill: #e6edf3; }
    }
  </style>
  <rect class="card" x="0.5" y="0.5" width="319" height="265" rx="7"/>
  <text class="kicker" x="16" y="25">MOST RECENTLY</text>
  <text class="role" x="16" y="52">Frontend Architect</text>
  <text class="history" x="16" y="76">Previously <tspan class="history-strong">Tech Lead</tspan> and <tspan class="history-strong">Team Lead</tspan></text>

  <rect class="cell green" x="16" y="94" width="288" height="48" rx="4"/>
  <text class="label" x="28" y="115">Architecture</text>
  <text class="detail" x="28" y="132">Boundaries, contracts, evolvability</text>

  <rect class="cell" x="16" y="147" width="288" height="48" rx="4"/>
  <text class="label" x="28" y="168">Developer experience</text>
  <text class="detail" x="28" y="185">Fast feedback and paved paths</text>

  <rect class="cell green" x="16" y="200" width="288" height="48" rx="4"/>
  <text class="label" x="28" y="221">Scalability</text>
  <text class="detail" x="28" y="238">Systems that survive growth</text>
</svg>
