<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="495" height="155" viewBox="0 0 495 155">
  <title id="title">Public GitHub activity</title>
  <desc id="desc">A placeholder that will be replaced with current public GitHub activity by the profile workflow.</desc>
  <style>
    .card { fill: #f6f8fa; stroke: #d0d7de; }
    .title { fill: #1f2328; font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .copy { fill: #656d76; font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .bar { fill: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #161b22; stroke: #30363d; }
      .title { fill: #e6edf3; }
      .copy { fill: #8d96a0; }
      .bar { fill: #3fb950; }
    }
  </style>
  <rect class="card" x="0.5" y="0.5" width="494" height="154" rx="6"/>
  <g transform="translate(28 42)">
    <rect class="bar" x="0" y="48" width="8" height="17" rx="2"/>
    <rect class="bar" x="13" y="34" width="8" height="31" rx="2"/>
    <rect class="bar" x="26" y="41" width="8" height="24" rx="2"/>
    <rect class="bar" x="39" y="19" width="8" height="46" rx="2"/>
    <rect class="bar" x="52" y="27" width="8" height="38" rx="2"/>
    <rect class="bar" x="65" y="7" width="8" height="58" rx="2"/>
    <rect class="bar" x="78" y="23" width="8" height="42" rx="2"/>
  </g>
  <text class="title" x="143" y="65">Public GitHub activity</text>
  <text class="copy" x="143" y="91">Generated from public data · no rank · no language score</text>
</svg>
